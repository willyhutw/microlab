apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgresql-v2
spec:
  storageClassName: local-storage
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  # Pre-create on node-1 before sync: mkdir -p + chown 999:999 + chmod 700
  # (official postgres image runs as uid/gid 999; local PVs are not provisioned)
  local:
    path: /mnt/data/postgresql-v2
  claimRef:
    name: postgresql-v2
    namespace: data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-micro-node-1
