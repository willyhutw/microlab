# Replaces the NetworkPolicy the Bitnami chart used to render (data/postgresql).
# Bitnami's allowed 5432 from ANY source; this narrows it to the known consumers.
# Egress is left unrestricted (Bitnami's was `egress: [{}]`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql
  namespace: data
  labels:
    app.kubernetes.io/name: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        # same namespace
        - podSelector: {}
        # Grafana (kube-prometheus-stack) — grafana.ini database backend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        # langfuse (parked in apps/disabled/, ns `ai`; web + worker)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: langfuse
      ports:
        - protocol: TCP
          port: 5432
