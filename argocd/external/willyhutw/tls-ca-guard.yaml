---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tls-ca-guard
  namespace: istio-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tls-ca-guard
  namespace: istio-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["www-willyhu-tw-tls"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tls-ca-guard
  namespace: istio-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tls-ca-guard
subjects:
  - kind: ServiceAccount
    name: tls-ca-guard
    namespace: istio-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tls-ca-guard
  namespace: istio-system
spec:
  # Cloudflare's Certificate renews every 90d with a 15d renewBefore
  # window (certificate.yaml); every 6h comfortably catches a dropped
  # ca.crt well inside that window.
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: tls-ca-guard
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: tls-ca-guard
              # alpine/k8s bundles a matching kubectl + bash + coreutils,
              # is actively maintained, and publishes linux/arm64 builds
              # (this cluster's worker nodes are Raspberry Pi 5 / arm64).
              image: alpine/k8s:1.32.13
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  SECRET=www-willyhu-tw-tls
                  NS=istio-system

                  current="$(kubectl get secret "$SECRET" -n "$NS" -o jsonpath='{.data.ca\.crt}' 2>/dev/null || true)"
                  if [[ -n "$current" ]]; then
                    echo "OK: ${NS}/${SECRET} already has ca.crt, nothing to do."
                    exit 0
                  fi

                  echo "WARN: ${NS}/${SECRET} is missing ca.crt, patching from embedded Cloudflare Origin Pull CA..."
                  ca_b64="$(base64 -w0 /etc/cloudflare-ca/ca.crt)"
                  kubectl patch secret "$SECRET" -n "$NS" --type merge \
                    -p "{\"data\":{\"ca.crt\":\"${ca_b64}\"}}"
                  echo "OK: patched ca.crt into ${NS}/${SECRET}."
              volumeMounts:
                - name: cloudflare-ca
                  mountPath: /etc/cloudflare-ca
                  readOnly: true
          volumes:
            - name: cloudflare-ca
              configMap:
                name: cloudflare-origin-pull-ca
