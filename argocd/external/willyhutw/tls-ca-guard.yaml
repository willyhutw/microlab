# Guards against cert-manager renewal of istio-system/www-willyhu-tw-tls
# silently dropping the ca.crt key that the willyhutw Gateway needs for
# TLS mode: MUTUAL (Cloudflare Authenticated Origin Pulls).
#
# cert-manager's Certificate/www-willyhu-tw-tls (certificate.yaml) only
# manages tls.crt/tls.key; ca.crt was added out-of-band and cert-manager
# has been observed to drop unrelated keys from the Secret on renewal.
# This CronJob re-injects the Cloudflare Origin Pull CA if it's missing,
# so a renewal (every ~90d, cert-manager renews ~15d before expiry) can't
# silently break mTLS on the gateway.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-origin-pull-ca
  namespace: istio-system
data:
  # Cloudflare's Authenticated Origin Pull CA. Static, long-lived
  # (valid 2019-10-10 to 2029-11-01), published at
  # https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
  # Embedded rather than fetched at runtime so the guard has no external
  # network dependency and can't be broken by an egress policy or a
  # Cloudflare docs page change.
  ca.crt: |
    -----BEGIN CERTIFICATE-----
